server:
  port: 8080
spring:
  application:
    name: "CrediYa-AUTENTICACION"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya_autenticacion"
    schema: "public"
    username: "postgres"
    password: "postgres"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  usuario:
    usuarios: "/api/v1/usuarios"
    usuarioById: "/api/v1/usuarios/{id}"

springdoc:
  api-docs:
    path: "/api/v1/api-docs"
  swagger-ui:
    path: "/api/v1/swagger-ui.html"